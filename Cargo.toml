[package]
name = "sigmasix"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level=1

[profile.dev.package."*"]
opt-level=3

[dependencies]
bevy = "0.19.1"
bevy-nest = "0.7.0"
bevy_asset_loader = { version = "^0.27.0", features = ["2d"] }
bevy_rapier3d = { version = "0.36.0", features = ["debug-render-3d"] }
